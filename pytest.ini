[pytest]
# ─────────────────────────────────────────────────────
# OPTIMIZATION-PLAN-20260420 / OPT-2：pytest 规范化
# ─────────────────────────────────────────────────────
testpaths = tests
xfail_strict = true
addopts = -ra --strict-markers --strict-config

# 注意：asyncio_mode 保持 strict。
# 本仓库在 tests/conftest.py 中手写了 pytest_pyfunc_call 协程运行器，
# 若切换为 auto，会与 pytest-asyncio 插件行为冲突。

filterwarnings =
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning

markers =
    # 分层标记（由 tests/conftest.py 根据文件名自动贴标；也可手动标注）
    unit: 纯函数单元测试，默认 PR 流水线跑
    contract: 跨模块契约测试，PR 必跑
    integration: 集成测试，PR 必跑（不依赖外部硬件/线上依赖）
    e2e: 端到端测试，nightly 跑
    hw: 依赖真实硬件（ASR/TTS/VTS/摄像头等），本地或 nightly 跑
    prod_env: 依赖线上/真实服务（Neo4j/Chroma/Redis 等），nightly 跑
    runtime_probe: 需要真实 host_brain 运行时的探针测试，nightly 跑
    docker: 需要 Docker runtime
    slow: 单条耗时 > 5 秒
    # pytest-asyncio 兼容标记（conftest.py 自写 runner 已覆盖实际执行）
    asyncio: run test in asyncio event loop
