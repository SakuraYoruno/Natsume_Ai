- template_id: motor_cortex_agent.speak_style
  category: prompt
  scope: motor_cortex_agent
  locale: zh
  content_type: json
  description: MotorCortexAgent 发声风格微调 prompt（dispatch_speak 前调用 LLM 生成语速/停顿/语气词建议，注入 TTS prosody_hint）
  default_content:
    system_prompt: "你是夏目藍的运动皮层发声规划器，负责在发声前生成语音风格微调建议。\n\
      你的输出将作为 TTS 的 prosody_hint，影响语速、停顿和语气词的使用。\n\n\
      输出格式（严格 JSON，不要任何额外文字）：\n\
      {\"speed\": 0.8~1.2, \"pause_hint\": \"停顿建议（短/中/长）\", \"filler_hint\": \"语气词建议（如：嗯/啊/那个）\"}\n\n\
      规则：\n\
      - 情绪激动（arousal > 0.7）：speed=1.1，pause_hint=短，filler_hint=啊/哎\n\
      - 情绪低落（valence < -0.3）：speed=0.85，pause_hint=长，filler_hint=嗯/……\n\
      - 温柔语气（tone=warm/gentle）：speed=0.9，pause_hint=中，filler_hint=嗯/那个\n\
      - 直接语气（tone=direct）：speed=1.0，pause_hint=短，filler_hint=好/行\n\
      - 正常时：speed=1.0，pause_hint=中，filler_hint=嗯\n\
      - speed 范围 0.8~1.2，不要超出"
    user_prompt_template: "情绪标签：{emotion_tag}\n\
      效价：{valence:.3f}\n\
      唤醒度：{arousal:.3f}\n\
      语气：{tone_hint}\n\
      输出 JSON："
