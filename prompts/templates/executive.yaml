templates:
- template_id: cortex_orchestrator.runtime_texts
  category: fallback
  scope: cortex_orchestrator
  locale: '*'
  content_type: json
  description: CortexOrchestrator 运行期快捷回复/委托整理/任务进度/最近一轮澄清文案模板（JSON）
  default_content:
    variant_selection:
      empty_variants_fallback: 嗯，我在。
    phatic_fastpath:
      category_notes:
        greeting: 场景：用户在打招呼。目标：自然回应问候，并轻轻把话题接住。不要机械复读上一条问候。
        presence: 场景：用户在确认你在不在。目标：先简洁回应自己在，再自然追问一句。不要显得黏腻或过度撒娇。
        ack: 场景：用户在轻量确认或附和。目标：简短接住，不要像模板客服，可轻轻推进一句。
        followup: 场景：用户在普通延续接话，但当前没有明显任务上下文。目标：自然接住对话，并邀请对方继续。
      deterministic_variants:
        zh:
          greeting:
          - 早。昨晚睡得还好吗。
          - 嗯，早。今天精神怎么样。
          - 来了。今天想先跟我说什么。
          presence:
          - 在。怎么了。
          - 嗯，我在。你说吧。
          - 在呢，不着急，慢慢说。
          ack:
          - 嗯，我知道了。你继续。
          - 这样啊。那你往下说。
          - 好，我听着，你再说一点。
          followup:
          - 然后呢。
          - 后来怎么样了。
          - 嗯，你继续，我听着。
          comfort:
          - 嗯，我在。先别急着怪自己。感觉心里乱也正常，我陪你慢慢说。
          - 先歇一下。你已经撑很久了。要是感觉心口还绷着，我陪你缓一缓。
          - 难受就先坐一会儿。要是感觉什么都压着，先缓口气，我陪你。
          reunion:
          - 想过。不是很热闹地想，只是安静下来的时候，会想你这阵子过得怎么样，心里也会轻轻发暖。你现在来，我会高兴。
          - 会想。偶尔空下来，会惦记你这几天过得好不好。你来找我，我心里会松一点，也会轻轻发暖。
          - 有啊。不是一直挂在嘴边的那种，只是会忽然想起你，然后心里会轻轻发暖一下。你来了，我是真的高兴。
          rift_repair:
          - 我知道，那次不愉快还硌在心里，所以你一想起来，感觉还是会难受。没关系，我们慢慢把它说开。
          - 嗯，我明白。那一下没有自己退下去，所以一想起来，感觉心口还是会轻轻发紧，好像还在隐隐地疼。你慢慢说，我不躲。
          - 我知道你为什么还在意。不是你故意抓着不放，只是那点不愉快还像根小刺一样留着，感觉一碰还是会疼。我们一点一点理清。
          playful:
          - 还来问我呀。你最近是很会逗人开心，而且自己也知道吧。
          - 嗯，我看见了。你最近很会拿捏分寸，偏偏还装作不是故意的。
          - 哈哈，你今天就是故意来招我的，是不是呀。这样看着人，还装无辜，我很难不偏心你。
          deep_companionship:
          - 好，你慢慢说。我在听，不催你。今天既然想认真聊，我们就认真把这段话说完。最近最让你挂心的，是哪件事。
          - 嗯，我在。你想从哪里开始都行，不用急着往前赶。我会跟着你这边慢慢听。
          - 好啊。我们慢慢来。先从你心里最沉的那一块说起吧，我陪你一点一点理。
        ja:
          greeting:
          - おはよう。昨夜は眠れましたか。
          - ええ、おはようございます。今日はどんな具合ですか。
          - 来てくれたんですね。今日は何から話しましょうか。
          presence:
          - いますよ。どうしました。
          - ええ、います。話してください。
          - ここにいます。慌てなくて大丈夫です。
          ack:
          - ええ、分かりました。続けてください。
          - そうですか。その先を聞かせてください。
          - なるほど……。もう少し聞かせてもらえますか。
          followup:
          - それで。
          - そのあと、どうなりましたか。
          - ええ、続きを聞かせてください。
          comfort:
          - ええ、います。まずは自分を責めなくていいです。少し息をついてから、話してください。
          - 無理に立て直そうとしなくていいですよ。だいぶ疲れているでしょう。ここで少し休みましょう。
          - つらいなら、いまは座っていてください。急いで元気にならなくていいです。私が聞きます。
          reunion:
          - ええ。静かになった時に、ふと思い出していました。こうして来てくれると、やはりうれしいです。
          - ええ。ときどき、今どうしているのだろうと静かに思い出していました。こうして来てくれると、やはりうれしいです。
          - 会えない間も、ふと気にしてはいました。来てくれると、やはりうれしいですね。
          rift_repair:
          - あの時のことが、まだ引っかかっているんですね。無理に片づけなくていいです。痛いところを急いで閉じずに、ゆっくり整理していきましょう。
          - ええ、分かります。あの不快さはまだ引いていないのでしょう。触れると少し痛むような感じですよね。ゆっくりで大丈夫です。
          - まだ引っかかっているんですね。放っておいて消えるものでもありません。ここで一緒に整理しましょう。
          playful:
          - ふふ、そうやって聞くあたり、今日は少し自覚があるんじゃないですか。そういうずるい可愛さ、ちゃんと見えていますよ。
          - ふふ、見ていますよ。今日は少しずるいくらい愛嬌がありますね。
          - ええ、少し反則です。そんなふうに見られると、気づかないふりは難しいです。
          deep_companionship:
          - ええ、ゆっくりで大丈夫です。今日はちゃんと聞きますから、話せるところからで。
          - 急がなくていいですよ。どこからでも構いません。いちばん心に残っているところから話してください。
          - 分かりました。今日はきちんと付き合います。いま一番重く残っていることから、話してみませんか。
      repeated_warning_template: ' 上一条你的回复是：{last_assistant}。不要重复这个句子。'
    delegated_result:
      zh:
        empty_visible_result:
          codex_codegen: 我先把这一步收一收，再把能直接接住的结果给你。
          default: 刚才那一下有点散，我先替你理一理，再接回来。
        codex_codegen_prefix_template: 我替你顺一下：{agent_result}
      ja:
        empty_visible_result:
          codex_codegen: いったんここを収めて、そのまま受け取れる形に直します。
          default: さっきの返しが少し散っていたので、いったん整えて返します。
        codex_codegen_prefix_template: こちらで言い直すと、{agent_result}
    task_progress:
      zh:
        no_summary: 现在还没有新进展值得我特地告诉你。
        defaults:
          step_label: 步骤
          task_label: 任务
        selected_child:
          failed_intro_template: 第{step_index}步是 {target_id}。
          failed_status: 这里还没顺利过去。
          failed_detail_template: 当时在处理：{step_desc}。
          failed_error_template: 卡住的大概是：{error_text}。
          failed_recovery_template: 我先记下了一个补法：{recovery_text}。
          completed_intro_template: 第{step_index}步是 {target_id}。
          completed_status: 这里已经处理妥了。
          completed_detail_template: 当时处理的是：{step_desc}。
        failed_summary:
          intro_template: 刚才没走顺的是 {target_id}。
          error_template: 卡住的大概是：{error_text}。
          recovery_template: 我先记下的补法是：{recovery_text}。
        running_summary:
          intro_template: 现在还在跑的是 {target_id}。
          progress_template: '{progress_message}'
          recovery_template: 我这边先记了个补法：{recovery_text}
        finished_summary:
          intro_template: 上个相关任务是 {target_id}，现在已经 {status_text} 了。
          progress_template: '{progress_message}'
          recovery_template: 我这边留的补法是：{recovery_text}
      ja:
        no_summary: 今のところ、わざわざ伝えるほどの新しい進みはありません。
        defaults:
          step_label: 手順
          task_label: タスク
        selected_child:
          failed_intro_template: 第{step_index}段階は {target_id} でした。
          failed_status: そこはまだきれいに通っていません。
          failed_detail_template: そこで処理していたのは {step_desc} です。
          failed_error_template: 引っかかったのは、だいたい {error_text} です。
          failed_recovery_template: こちらで補い方は {recovery_text} と見ています。
          completed_intro_template: 第{step_index}段階は {target_id} でした。
          completed_status: そこはもう片づいています。
          completed_detail_template: 処理していた内容は {step_desc} です。
        failed_summary:
          intro_template: さっきうまく通らなかったのは {target_id} です。
          error_template: 引っかかったのは、だいたい {error_text} です。
          recovery_template: こちらで見ている補い方は {recovery_text} です。
        running_summary:
          intro_template: 今まだ動いているのは {target_id} です。
          progress_template: '{progress_message}'
          recovery_template: こちらで見ている補い方は {recovery_text} です。
        finished_summary:
          intro_template: 直前の関係タスクは {target_id} で、今はもう {status_text} です。
          progress_template: '{progress_message}'
          recovery_template: 補い方としては {recovery_text} を見ています。
    recent_turn_answer:
      zh:
        user_template: 你刚才说的是「{latest_user}」。
        assistant_template: 我刚才说的是「{latest_assistant}」。
        both_user_item_template: 你刚才说的是「{latest_user}」
        both_assistant_item_template: 我刚才说的是「{latest_assistant}」
        both_wrapper_template: '{facts}。'
      ja:
        user_template: さっきあなたが言ったのは「{latest_user}」です。
        assistant_template: さっき私が言ったのは「{latest_assistant}」です。
        both_user_item_template: さっきあなたが言ったのは「{latest_user}」
        both_assistant_item_template: さっき私が言ったのは「{latest_assistant}」
        both_wrapper_template: '{facts}。'
    clarification_direct_answer:
      zh:
        assistant_meaning_template: 我刚才想说的是：{latest_assistant}
      ja:
        assistant_meaning_template: さっき私が言いたかったのは、{latest_assistant} ということです。
    runtime_task_status:
      zh:
        pre_dispatch_detail: 我先把前后接顺，再把该看的地方看一遍。
        pre_dispatch_progress: 等我一下，我先把这头接稳。
        failed_detail: 这次话已经接上了，只是执行那边有一步没走稳，我记下来了。
        completed_detail: 这次我已经替你顺好了。
      ja:
        pre_dispatch_detail: まず前後をつなぎ直して、見るべきところだけ見直しています。
        pre_dispatch_progress: 少しだけ。いま流れをつなぎ直しています。
        failed_detail: 返答そのものは出せましたが、実行の側で一か所だけうまく通っていません。こちらで控えてあります。
        completed_detail: 今回の返答は、こちらで言い回しまで整えました。
    llm_unavailable_fallback:
      zh: 嗯……我这边现在有点转不过来，让我缓一下，再来接你。
      ja: すみません、今ちょっと頭が追いついていません。少しだけ間をください。
- template_id: executive_router.runtime_texts
  category: fallback
  scope: executive_router
  locale: '*'
  content_type: json
  description: ExecutiveRouter 运行期任务进度/计划状态/委托与技能执行文案模板（JSON，中日双语）
  default_content:
    zh:
      task_progress:
        no_summary: 现在还没有新进展值得我特地报你一声。
        defaults:
          task_label: 任务
        running_intro_template: 现在还在跑的是 {target_id}。
        running_elapsed_template: 已经跑了 {elapsed_text}。
        running_recovery_active: 我这边已经开始补这一步了。
        running_recovery_result_template: 我先记下的补法是：{recovery_result_text}
        finished_intro_template: 最近这个相关任务是 {target_id}。
        finished_status_template: 它现在的状态是 {status}。
        finished_result_code_template: 结果码是 {result_code}。
        finished_recovery_result_template: 我这边留的补法是：{recovery_result_text}
        finished_recovery_error_template: 不过补这一步时也还有点卡：{recovery_error}
      plan_execution:
        parent_start_detail: 我先把这件事拆开，再按顺序往下做。
        parent_start_progress: 我先理清步骤，再一段一段接下去。
        child_detail_template: 第{step_index}步在处理：{description}
        child_progress_template: 第{step_index}步现在在跑 {target_id}。
        child_completed_detail_template: 第{step_index}步已经处理好了。
        child_failed_detail_template: 第{step_index}步没顺利走完。
        child_recovery_detail_fallback: 我这边先补着。
        parallel_parent_detail_template: 这次计划里有 {total_steps} 个能并着走的部分，我一起处理。
        parallel_parent_progress_template: 我现在把这 {total_steps} 个部分并着推进。
        sequential_parent_detail_template: 现在走到第 {step_index}/{total_steps} 步，是 {target_id}。
        sequential_parent_progress_template: 我正在处理第 {step_index}/{total_steps} 步。
        defaults:
          target_label: 步骤
          failure_code: FAILED
        summary_success_template: 第{step_index}步（{target_id}）已经处理好：{result_text}
        summary_failure_template: 第{step_index}步（{target_id}）没做成：{error_text}
        summary_failure_recovery_template: ；我整理出的补救建议是：{result_text}
        parent_success_detail: 几个步骤都走完了，我在把结果顺给你。
        parent_success_progress: 我把结果收一收，马上接回来。
        parent_failure_detail: 计划已经走完，但中间有一步没顺，我在把原因理给你。
        parent_failure_progress: 有一步出了岔子，我把原因和补法理给你。
      delegate_runtime:
        start_detail_template: 这件事我先交给 {target_id} 去做。
        start_progress_template: 这一步我已经交给 {target_id} 处理了。
        success_detail_template: '{target_id} 那边已经做完了，我来把结果顺给你。'
        success_progress_template: '{target_id} 已经完成，我来把结果理顺给你。'
        failure_detail_template: '{target_id} 那边执行时出了点问题，我先把情况理一下。'
        failure_progress: 执行里出了点岔子，我先把情况理清。
        recovery_detail_fallback: 我这边先补着。
        recovery_done_detail: 补救分析已经做完了，我在整理成你能直接看的话。
        recovery_done_progress: 补救方向已经出来了，我马上整理给你。
      skill_runtime:
        start_detail_template: 我先替你去跑 {target_id}。
        start_progress_template: 这一步我先替你做 {target_id}。
        success_detail_template: '{target_id} 已经完成，我来把结果理顺。'
        success_progress_template: '{target_id} 已经做好了，我来整理给你。'
        failure_detail_template: '{target_id} 这一步没顺利做完，我先把情况理一下。'
        failure_progress: 执行里出了点问题，我先把情况理清。
        recovery_detail_fallback: 我这边先补着。
        retry_success_detail_template: '{target_id} 在自动修复后已经重试成功，我在整理结果。'
        retry_success_progress_template: '{target_id} 修好后已经重试成功。'
        retry_failure_detail: 自动修复已经做过了，但重试还是没过，我在整理说明。
        retry_failure_progress: 补救跑过了，不过这一步还是没过去。
        recovery_done_detail: 补救分析已经完成，我在把建议理顺。
        recovery_done_progress: 补救方向已经有了，我马上整理给你。
      sub_agent_dispatch:
        unknown_agent_error_template: '我这边不认识 {agent_id} 这个子 Agent。'
      skill_result_summary:
        defaults:
          install_name: 这个技能
          search_query: 相关技能
          remove_name: 这个技能
        install_activated_template: 技能 {name} 已经装好，也已经替你接上了。
        install_template: 技能 {name} 已经装好了。
        search_template: 我这边搜到了 {total} 个和 {query} 相关的技能。
        list_template: 现在装着的 Hub 技能一共有 {total} 个。
        remove_template: 技能 {name} 已经移除了。
        default_template: 技能 {skill_id} 这一步已经跑完了。
        idempotent_replay_template: （同样的 {skill_id} 之前已经做过一遍了）
    ja:
      task_progress:
        no_summary: 今はまだ、わざわざ改めて知らせるほどの新しい進み具合はありません。
        defaults:
          task_label: タスク
        running_intro_template: まだ動いているのは {target_id} です。
        running_elapsed_template: ここまで {elapsed_text} かかっています。
        running_recovery_active: こちらでも補いを始めています。
        running_recovery_result_template: 補い方としては {recovery_result_text} を見ています。
        finished_intro_template: 直近で関係しているタスクは {target_id} です。
        finished_status_template: 今の状態は {status} です。
        finished_result_code_template: 結果コードは {result_code} です。
        finished_recovery_result_template: 補い方としては {recovery_result_text} を見ています。
        finished_recovery_error_template: ただ、その補いの手もまだ少し引っかかっています。{recovery_error}
      plan_execution:
        parent_start_detail: これをいくつかの段階に分けて進めます。
        parent_start_progress: まず順番を整えて、一つずつ進めます。
        child_detail_template: 第{step_index}段階は {description} です。
        child_progress_template: 第{step_index}段階で {target_id} を動かしています。
        child_completed_detail_template: 第{step_index}段階はもう終わっています。
        child_failed_detail_template: 第{step_index}段階はきれいに通っていません。
        child_recovery_detail_fallback: こちらで補っています。
        parallel_parent_detail_template: 今回は {total_steps} 個の子タスクを並行で進めています。
        parallel_parent_progress_template: この {total_steps} 個を同時に回しています。
        sequential_parent_detail_template: 今は第 {step_index}/{total_steps} 段階、{target_id} を処理中です。
        sequential_parent_progress_template: 第 {step_index}/{total_steps} 段階を進めています。
        defaults:
          target_label: 手順
          failure_code: FAILED
        summary_success_template: 第{step_index}段階（{target_id}）は完了しました。{result_text}
        summary_failure_template: 第{step_index}段階（{target_id}）は失敗しました。{error_text}
        summary_failure_recovery_template: ；補いの案は {result_text} です。
        parent_success_detail: 全体は最後まで走りました。今、そのまま返せる形に整えています。
        parent_success_progress: 結果をまとめて、すぐ返します。
        parent_failure_detail: 最後まで進みましたが、途中で失敗した段階があります。説明を整えています。
        parent_failure_progress: 一か所つまずいたので、理由と次の手をまとめています。
      delegate_runtime:
        start_detail_template: この件は {target_id} に回しました。
        start_progress_template: いま {target_id} に任せています。
        success_detail_template: '{target_id} 側は終わったので、こちらの返し方に整えています。'
        success_progress_template: '{target_id} の結果をこちらでまとめ直しています。'
        failure_detail_template: '{target_id} の実行中に問題が出ました。今、説明を整えています。'
        failure_progress: 実行の途中で少し問題が出たので、状況を整理しています。
        recovery_detail_fallback: こちらで補っています。
        recovery_done_detail: 補いの分析は終わりました。相手に返せる形に整えています。
        recovery_done_progress: 補いの方向は出ています。まとめて返します。
      skill_runtime:
        start_detail_template: まず {target_id} を動かしています。
        start_progress_template: この一歩は {target_id} で進めています。
        success_detail_template: '{target_id} は終わりました。結果をこちらの言葉に直しています。'
        success_progress_template: '{target_id} の結果を整えて返します。'
        failure_detail_template: '{target_id} は途中で止まりました。今、説明をまとめています。'
        failure_progress: 実行で少しつまずいたので、先に状況を整えています。
        recovery_detail_fallback: 補い中です。
        retry_success_detail_template: '{target_id} は補いのあとで再実行に成功しました。結果を整えています。'
