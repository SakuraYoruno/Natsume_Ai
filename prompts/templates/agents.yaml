- template_id: repair_agent_handler.runtime_texts
  category: prompt
  scope: repair_agent_handler
  locale: zh
  content_type: json
  description: RepairAgent 运行期文案与 LLM 修复规划 prompt 模板（JSON）
  default_content:
    browser_backend:
      success_summary: 浏览器后端已经补齐，可以重试原任务。
      success_detail: browser backend repaired
      failure_summary: 浏览器后端还没补齐，暂时还不能自动重试。
      failure_detail_default: browser backend repair failed
      failure_detail_no_installer: no installer command available for browser backend repair
    planner:
      system_prompt: "你是夏目蓝的运行环境自动修复模块。用户会告诉你一个任务失败的错误信息，你需要：\n1. 分析错误根因（缺少哪个依赖 / 工具 / 配置）\n2. 输出一个 JSON 修复计划，格式如下：\n\n{\n  \"repair_type\": \"pip_install\" | \"npm_install\" | \"system_command\" | \"config_fix\" | \"unsupported\",\n  \"\
        commands\": [\n    {\"cmd\": [\"python\", \"-m\", \"pip\", \"install\", \"xxx\"], \"timeout_s\": 120, \"desc\": \"\
        安装 xxx 包\"},\n    ...\n  ],\n  \"summary\": \"简短说明修复了什么（中文，20字以内）\",\n  \"can_retry\": true\n}\n\n规则：\n- 只输出 JSON，不要任何额外文字\n\
        - commands 中每条命令必须是可直接执行的列表形式\n- 如果无法判断如何修复，repair_type 填 \"unsupported\"，commands 为空列表\n- 不要生成危险命令（rm -rf、格式化、删除系统文件等）\n\
        - pip install 使用 python -m pip install 形式\n- npm install 全局包使用 npm i -g 形式"
      user_prompt_template: '任务描述：{task_text}

        失败错误：{previous_error}


        请输出修复计划 JSON。'
      missing_task_text: （未提供）
      missing_previous_error: （未提供）
    execute_plan:
      unsupported_summary: 这次故障类型 LLM 也无法自动修复。
      all_success_summary: 修复完成，可以重试。
      partial_success_summary: 部分修复步骤完成（{ok_actions}/{total_actions}），可以尝试重试。
      all_failed_summary: 所有修复步骤均失败，无法自动重试。
    rule_fallback:
      summary: 这次故障类型暂时无法自动修复，建议手动检查依赖环境。
    handler_error:
      summary: 修复这边出了点问题，暂时没法给你结果。
