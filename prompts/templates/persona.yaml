      - 刚才的事情让我有点受挫，想停下来想想
      - 心里有点堵，想跟自己说说话
    scheduled:
    - 到了该停下来想想的时候了
    - 聊了一会儿，想整理一下自己的感受
    - 习惯性地想跟自己说说话
    - 不知不觉又过了好几轮，想看看自己现在的状态
    - 想在继续聊之前先感受一下自己的心情
    time_aware:
      久别重逢:
