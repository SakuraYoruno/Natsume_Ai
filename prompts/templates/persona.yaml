- template_id: self_reflection.trigger_reason_templates
  category: fallback
  scope: self_reflection
  locale: zh
  content_type: json
  description: SelfReflection 触发原因文案模板（JSON）
  default_content:
    emotion:
      SAD:
      - 因为今天聊到了一些让我有点难过的事，想整理一下心情
      - 刚才的对话让我心里有点沉，想静下来想想
      - 今天感觉有些低落，想跟自己说说话
      LOVING:
