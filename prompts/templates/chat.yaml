      - 深い記憶ほど、そっと触れるほうが自然に届く。
    memory_count_hints:
      '1': ふと一つ思い出したことがある。必要なら、そっとつなげていい。
      '2': いくつかの共通の記憶が浮かんでいて、言葉に少し温度が乗る。
      '3': 共有した記憶がかなりあるので、相手を分かっている感じが自然に出る。
    prompt_blocks:
      title: '【関係の語気補正】'
      stage_line: '- 関係段階: {stage}（親密度 {intimacy}）'
      style_line: '- 語気の基調: {style_instruction}'
