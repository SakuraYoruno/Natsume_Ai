        system_info: 第{step_index}步，系统信息我已经看过了。
        process_list: 第{step_index}步，进程列表我也看过了。
        network_status: 第{step_index}步，网络状态我已经检查过了。
        hub_skill_search: 第{step_index}步，我已经替你查过和{topic}相关的技能了。
        hub_skill_list: 第{step_index}步，现在装着的 Hub 技能我已经替你理过了。
        hub_skill_install: 第{step_index}步，这个 Hub 技能我已经替你装上了。
        hub_skill_remove: 第{step_index}步，这个 Hub 技能我已经替你卸掉了。
        file_read: 第{step_index}步，文件内容我已经看过了。
        file_write: 第{step_index}步，文件我已经写好了。
        file_list: 第{step_index}步，目录内容我已经看过了。
        codex_codegen: 第{step_index}步，代码这部分我已经替你理好了。
        intent_agent: 第{step_index}步，接下来怎么做我已经替你确认过了。
        __with_result: 第{step_index}步，{description_or_target} 这部分我已经处理好了。
        __default: 第{step_index}步，{description_or_target} 这部分我已经处理好了。
      ja:
        web_search: 第{step_index}段階で、{topic} は見てあります。
        memory_store.remembered: 第{step_index}段階で、{remembered} は控えてあります。
        memory_store.default: 第{step_index}段階で、この件は控えてあります。
        system_info: 第{step_index}段階で、システム情報は見てあります。
        process_list: 第{step_index}段階で、プロセス一覧も見てあります。
        network_status: 第{step_index}段階で、ネットワークの状態は見てあります。
        hub_skill_search: 第{step_index}段階で、{topic} に近い技能は調べてあります。
        hub_skill_list: 第{step_index}段階で、今つながっている Hub 技能は整理してあります。
        hub_skill_install: 第{step_index}段階で、この Hub 技能は入れてあります。
        hub_skill_remove: 第{step_index}段階で、この Hub 技能は外してあります。
        file_read: 第{step_index}段階で、ファイルの中身は見てあります。
        file_write: 第{step_index}段階で、ファイルは書いてあります。
        file_list: 第{step_index}段階で、ディレクトリの中は見てあります。
        codex_codegen: 第{step_index}段階で、コードまわりは整理してあります。
        intent_agent: 第{step_index}段階で、進め方は見てあります。
        __with_result: 第{step_index}段階で、{description_or_target} は片づいています。
        __default: 第{step_index}段階で、{description_or_target} は片づいています。
    step_failure:
      zh:
        base: 第{step_index}步，{description_or_target} 这部分没顺利走完。
        error_suffix: 卡住的大概是：{error_text}。
        recovery_suffix: 我先记下的补法是：{recovery_text}。
      ja:
        base: 第{step_index}段階で、{description_or_target} のところがうまく通っていません。
        error_suffix: 引っかかったのは、だいたい {error_text} です。
        recovery_suffix: 補い方としては {recovery_text} を見ています。
    summary:
      zh:
        intro_parallel: 我把这件事拆成了 {total_steps} 步，刚才已经并着跑过了。
        intro_sequential: 我把这件事拆成了 {total_steps} 步，刚才已经顺着走过了一遍。
        all_done: 现在这些都已经替你收好了。
        partial_done: 没走顺的地方，我也把补法一起理给你了。
      ja:
        intro_parallel: この件は {total_steps} 段階に分けて、さっき並行で走らせてあります。
        intro_sequential: この件は {total_steps} 段階に分けて、さっき順に通してあります。
        all_done: 今のところ、ここまではもう収まっています。
        partial_done: 通らなかったところは、補い方も一緒に整理してあります。
