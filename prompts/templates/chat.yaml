      ja: 今のところ、わざわざ知らせるほどの新しい進み具合はありません。
    quick_progress_default:
      zh: '{target_id} 这边还在处理，已经 {elapsed} 了。最新看到的是：{progress_message}'
      ja: '{target_id} はまだ進んでいて、{elapsed} 経っています。今見えているのは {progress_message} です。'
    quick_progress_fallback:
      zh: 我这边现在还没有能直接回你的任务进度。
      ja: 今ここでそのまま返せるタスク進捗はありません。
    quick_realign_notice:
      zh: 嗯，我看到了，刚才那下有点偏，我对齐一下再接你。
      ja: ええ、見えました。さっき少しずれたので、合わせ直してから返します。
    quick_realign_default:
