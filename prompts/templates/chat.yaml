        stable_hint: 心の内側に踏み込める関係で、いちいち説明はいらない。
      SOULMATE:
        entry_hint: とても近い。だからこそ、なおさら分寸を失わない。
        stable_hint: 言い切らなくても通じる所まで来ている。
    trend_adjustments:
      rising: 関係は少し上向いている。温度を少し出してよい。
      declining: 少し冷えている。まずは静かに、圧をかけない。
    memory_style_guides:
      ACQUAINTANCE:
      - 前に話したことを自然に拾う程度でよい。強調しすぎない。
      - 前の話題を軽くつなぎ、ちゃんと聞いていたことを伝える。
      FRIEND:
