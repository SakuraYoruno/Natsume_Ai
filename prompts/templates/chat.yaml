      rift_line: '- 裂け目への配慮: {rift_adjustment}（程度 {rift_severity}、修復 {rift_progress_pct}%）'
      trend_line: '- 関係の流れ: {trend_adjustment}'
      texture_line: '- 質感の補足: {texture_hint}'
      shared_memories_line: '- 共有した記憶: {memory_lines}'
      memory_style_line: '- 記憶の使い方: {shared_memory_hint}'
