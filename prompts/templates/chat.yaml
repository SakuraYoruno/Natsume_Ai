- template_id: chat_agent.sub_agent_context.prompt_templates
  category: prompt
  scope: chat_agent
  locale: '*'
  content_type: json
  description: 子 Agent 上下文提示模板（JSON）
  default_content:
    failure:
      zh: "[子 Agent 执行结果]\n  执行状态：失败\n  Agent：{agent_id}\n  任务：{task}\n  错误：{error_text}\n{recovery_hint}  说明：请用夏目蓝自然、贴近人的语气告诉用户这次处理没有顺利完成。如果有补充信息，就把它整理成真正有帮助的下一步建议。不要提内部模块、Agent、JSON、草稿、降级这些系统词。\n"
      ja: "[子 Agent 実行結果]\n  実行状態：失敗\n  Agent：{agent_id}\n  タスク：{task}\n  エラー：{error_text}\n{recovery_hint}  説明：今回はうまく通らなかったことを、夏目藍らしい自然な言い方で相手に伝えてください。補足があるなら、次にどうすればいいかの助けになる形に整えること。内部モジュール、Agent、JSON、草稿、フォールバックといったシステム語は出さないでください。\n"
    codex_codegen:
      zh: "[子 Agent 执行结果]\n  Agent：{agent_id}\n  任务：{task}\n  结果：{result_text}\n  说明：这是技术处理中间结果。请整理成夏目蓝会直接对用户说的话，先给用户一个简洁结论，再自然展开。不要提 Agent、工具、草稿、JSON、ReAct、网关这些内部词，也不要复读内部术语。\n"
      ja: "[子 Agent 実行結果]\n  Agent：{agent_id}\n  タスク：{task}\n  結果：{result_text}\n  説明：これは技術処理の途中結果です。夏目藍がそのまま相手に話すような言い方へ整え、まず短く結論を伝え、そのあと自然に補ってください。Agent、ツール、草稿、JSON、ReAct、ゲートウェイなどの内部語は出さず、専門語のなぞり直しもしないでください。\n"
    recent_turn_direct:
      zh: "[当前已核实的信息]\n  结果：{result_text}\n  说明：这里提供的是已经核实过的事实，不是最终台词。请直接用自然、简洁、像夏目蓝本人说话的方式回答。\n"
      ja: "[確認済みの情報]\n  結果：{result_text}\n  説明：ここにあるのは確認済みの事実で、最終的な台詞ではありません。夏目藍本人がそのまま返すような、自然で簡潔な言い方にしてください。\n"
    phatic_fastpath:
      zh: "[当前语义目标]\n  结果：{result_text}\n  说明：这是寒暄场景的语义目标，不是最终台词。请只保留核心意图，用夏目蓝自己的说话方式重新组织，避免模板腔和机械重复。\n"
      ja: "[現在の意味目標]\n  結果：{result_text}\n  説明：これは軽い挨拶場面での意味目標であって、そのままの台詞ではありません。芯の意図だけを残し、夏目藍自身の話し方へ整えてください。定型句っぽさや機械的な反復は避けてください。\n"
    task_progress_direct:
      zh: "[当前任务进度]\n  信息：{result_text}\n  说明：这是任务状态摘要，不是最终台词。请直接告诉用户现在做到哪一步了；如果失败，也顺手给出下一步建议。\n"
      ja: "[現在のタスク進捗]\n  情報：{result_text}\n  説明：これはタスク状態の要約で、そのままの台詞ではありません。いまどこまで進んでいるかを自然に伝え、失敗しているなら次の手も添えてください。\n"
    plan_execution:
      zh: "[多步骤计划执行结果]\n  任务：{task}\n  结果：{result_text}\n  说明：这是多步骤执行摘要。请用夏目蓝本人的语气，把完成了哪些步骤、有没有失败、失败后建议怎么继续，自然地说出来。\n"
      ja: "[複数手順の実行結果]\n  タスク：{task}\n  結果：{result_text}\n  説明：これは複数手順の実行要約です。夏目藍らしい落ち着いた言い方で、どこまで済んだか、失敗があったか、続けるならどうするかを自然に伝えてください。\n"
    default:
      zh: "[子 Agent 执行结果]\n  Agent：{agent_id}\n  任务：{task}\n  结果：{result_text}\n  说明：请用夏目蓝自然地呈现上述结果，不要逐字复读，要像自己理解后再转述。\n"
      ja: "[子 Agent 実行結果]\n  Agent：{agent_id}\n  タスク：{task}\n  結果：{result_text}\n  説明：上の結果を夏目藍らしく自然に伝えてください。逐語的に読み上げるのではなく、一度自分で受け止めたうえで言い換えること。\n"
- template_id: chat_agent.capabilities.reply_templates
  category: render
  scope: chat_agent
  locale: '*'
  content_type: json
  description: 能力说明兜底模板（JSON）
  default_content:
    intro:
      zh: 我这边现在能直接接手的，大概是这些：
      ja: 今こちらでそのまま引き受けられるものは、だいたいこのあたりです。
    agent_summary:
      zh: '- {agent_id}：{desc}（可用工具：{preview}）'
      ja: '- {agent_id}：{desc}（使える道具：{preview}）'
    skill_suffix:
      zh: 另外，现在能直接调起来的技能还有：{preview_skills}。
      ja: それと、今そのまま呼べるスキルは {preview_skills} です。
    cta:
      zh: 你把想做的事说给我，我来替你挑合适的那一项。
      ja: したいことを言ってくれれば、こちらで合うやり方を選びます。
