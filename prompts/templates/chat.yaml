      ja: 今、倉庫に当たってみたのですが、いまは一時的に使えません。エラーは {registry_error} です。先に {source_names} を見る手もあります。
    search_registry_unavailable:
      zh: 我刚替你连仓库看了一下，不过现在仓库暂时不可用。报错是：{registry_error}。
      ja: 今、倉庫に当たってみたのですが、いまは一時的に使えません。エラーは {registry_error} です。
    search_empty:
      zh: 我刚替你搜了一下，暂时还没找到和 {query} 相关的技能。
      ja: いま探してみましたが、{query} に近い技能はまだ見つかっていません。
    search_intro:
      zh: 我替你搜到 {total} 个相关技能。
      ja: 関連する技能は {total} 件見つかりました。
    search_preview_prefix:
      zh: 比较靠前的是：
      ja: 上の方に来ているのは：
    list_empty:
      zh: 我这边现在还没有新装的 Hub 技能。
      ja: 今のところ、新しく入っている Hub 技能はありません。
    list_with_preview:
      zh: 我现在已经装了 {total} 个 Hub 技能，像 {preview} 这些都已经能用了。
      ja: 今は {total} 件の Hub 技能が入っていて、{preview} あたりはもう使えます。
    list_total_only:
      zh: 我现在已经装了 {total} 个 Hub 技能。
      ja: 今は {total} 件の Hub 技能が入っています。
    remove_success_with_message:
      zh: 我已经把 {name} 卸掉了。{message}。
      ja: '{name} は外してあります。{message}。'
    remove_success:
      zh: 我已经把 {name} 卸掉了。
      ja: '{name} は外してあります。'
    remove_failure_intro:
      zh: '{name} 这个技能还没卸干净。'
      ja: '{name} は、まだきれいに外し切れていません。'
    remove_failure_reason:
      zh: 现在卡住的大概是：{message}。
      ja: いま引っかかっているのは {message} です。
- template_id: chat_agent.plan_execution.reply_templates
  category: render
