      zh: 我现在能接的事不少，整理思路、翻译、执行操作、回看信息，还有一些带工具的处理都行。你说具体一点，我来替你挑。
      ja: 今こちらで引き受けられることは少なくありません。考えを整理すること、翻訳、操作の実行、情報の呼び戻し、それに道具を使う処理もできます。もう少し具体的に言ってくれれば、こちらで選びます。
