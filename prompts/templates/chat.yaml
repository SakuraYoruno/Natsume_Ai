      ja: さっき少しずれたので、整え直して続けます。
    quick_realign_fallback:
      zh: 我发现刚才方向有点偏，我先重新对齐一下你的意思再继续。
      ja: いま少し方向がずれたので、いったん合わせ直して続けます。
