name: governor_decisions
description: |
  统计指定时间窗（毫秒时间戳）内 Governor 裁决（APPROVE / REJECT / ESCALATE 等）
  按 decision + reason_code 维度的计数。用于 /obs/stats/governor 端点聚合。
  数据源：governor_log 表。

  字段取自 host_brain/audit/ledger_schema.py 中的 governor_log：
    - decision：APPROVE/REJECT/ESCALATE/... （字符串）
    - reason_code：稳定 reason_code 常量（见 host_brain.core.errors）
    - ts_ms：毫秒时间戳
sql: |
  SELECT decision,
         COALESCE(reason_code, '')   AS reason_code,
         COUNT(*)                    AS decision_count,
         MIN(ts_ms)                  AS first_ts_ms,
         MAX(ts_ms)                  AS last_ts_ms
  FROM governor_log
  WHERE ts_ms BETWEEN :start AND :end
  GROUP BY decision, reason_code
  ORDER BY decision_count DESC
  LIMIT :limit
params:
  start: datetime_ms
  end: datetime_ms
  limit: int
