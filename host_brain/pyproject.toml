[project]
name = "host-brain"
version = "0.0.1"
description = "Natsume Host Brain skeleton"
requires-python = ">=3.11"
dependencies = [
  "neo4j>=6.1.0,<7",
  "chromadb>=1.4.0,<2",
  "langchain>=1.2.0,<2",
  "langchain-openai>=1.1.0,<2",
  "langgraph>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0,<10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
