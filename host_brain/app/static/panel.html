<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nastume AI — 链路可视化面板</title>
    <style>
        :root {
            --bg-primary: #0d0f1a;
            --bg-secondary: #141728;
            --bg-card: #1c2040;
            --bg-card-hover: #222650;
            --text-primary: #e8e6f0;
            --text-secondary: #8b90b0;
            --text-muted: #555a7a;
            --accent: #7c6fff;
            --accent-hover: #9d94ff;
            --accent-glow: rgba(124, 111, 255, 0.15);
            --success: #34d399;
            --success-bg: rgba(52, 211, 153, 0.1);
            --warning: #fbbf24;
            --warning-bg: rgba(251, 191, 36, 0.1);
            --danger: #f87171;
            --danger-bg: rgba(248, 113, 113, 0.1);
            --info: #60a5fa;
            --info-bg: rgba(96, 165, 250, 0.1);
            --border: #252a4a;
            --border-light: #1e2340;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --radius: 12px;
            --radius-sm: 8px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* ── 顶部导航 ── */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }
        .header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 {
            font-size: 17px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .badge {
            background: var(--accent-glow);
            color: var(--accent);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(124,111,255,0.3);
        }
        .readonly-tag {
            background: transparent;
            color: var(--text-muted);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            border: 1px solid var(--border);
        }
        .header-spacer { flex: 1; }

        /* 自动刷新控件 */
        .auto-refresh-ctrl {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .refresh-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }
        .toggle-switch {
            width: 36px;
            height: 20px;
            background: var(--border);
            border-radius: 10px;
            position: relative;
            transition: background 0.2s;
            cursor: pointer;
        }
        .toggle-switch.on { background: var(--accent); }
        .toggle-knob {
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: left 0.2s;
        }
        .toggle-switch.on .toggle-knob { left: 19px; }
        .countdown-badge {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 11px;
            font-family: 'Consolas', monospace;
            color: var(--accent);
            min-width: 42px;
            text-align: center;
        }
        .countdown-badge.pulse { animation: pulse 1s ease-in-out; }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── 搜索区 ── */
        .search-section {
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }
        .search-row {
            display: flex;
            gap: 10px;
            align-items: center;
            max-width: 960px;
        }
        .search-input {
            flex: 1;
            padding: 9px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .search-input::placeholder { color: var(--text-muted); }
        .btn {
            padding: 9px 18px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: var(--bg-card-hover); color: var(--text-primary); }
        .btn-sm { padding: 5px 12px; font-size: 12px; }

        /* ── 主内容布局 ── */
        .main-content {
            padding: 20px 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            max-width: 1440px;
            margin: 0 auto;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            transition: border-color 0.2s;
        }
        .card:hover { border-color: rgba(124,111,255,0.25); }
        .card-full { grid-column: 1 / -1; }
        .card-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-title-badge {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1px 8px;
            font-size: 10px;
            color: var(--text-muted);
            margin-left: auto;
        }

        /* ── 统计卡片 ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            grid-column: 1 / -1;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            border-radius: var(--radius) var(--radius) 0 0;
        }
        .stat-info::before { background: linear-gradient(90deg, var(--accent), #c084fc); }
        .stat-success::before { background: linear-gradient(90deg, var(--success), #6ee7b7); }
        .stat-danger::before { background: linear-gradient(90deg, var(--danger), #fca5a5); }
        .stat-warning::before { background: linear-gradient(90deg, var(--warning), #fde68a); }
        .stat-error::before { background: linear-gradient(90deg, #f87171, #fb923c); }
        .stat-icon {
            font-size: 22px;
            margin-bottom: 8px;
            display: block;
        }
        .stat-value {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 2px;
            font-variant-numeric: tabular-nums;
        }
        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .stat-info .stat-value { color: var(--accent); }
        .stat-success .stat-value { color: var(--success); }
        .stat-danger .stat-value { color: var(--danger); }
        .stat-warning .stat-value { color: var(--warning); }
        .stat-error .stat-value { color: #fb923c; }

        /* ── 趋势折线图 ── */
        .trend-canvas-wrap {
            position: relative;
            height: 120px;
        }
        #trendCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .trend-legend {
            display: flex;
            gap: 14px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* ── 最近请求列表 ── */
        .recent-list { display: flex; flex-direction: column; gap: 6px; }
        .recent-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            border: 1px solid var(--border-light);
            cursor: pointer;
            transition: all 0.15s;
            font-size: 12px;
        }
        .recent-item:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
        }
        .recent-item.active {
            border-color: var(--accent);
            background: var(--accent-glow);
        }
        .recent-rid {
            font-family: 'Consolas', monospace;
            color: var(--accent);
            font-size: 11px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .recent-ts {
            color: var(--text-muted);
            font-size: 11px;
            white-space: nowrap;
        }
        .recent-status {
            padding: 2px 7px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }
        .rs-ok { background: var(--success-bg); color: var(--success); }
        .rs-reject { background: var(--danger-bg); color: var(--danger); }
        .rs-error { background: rgba(251,146,60,0.1); color: #fb923c; }
        .rs-unknown { background: var(--bg-card); color: var(--text-muted); }
        .recent-empty {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ── 时间线 ── */
        .timeline-container {
            max-height: 480px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        .timeline-container::-webkit-scrollbar { width: 4px; }
        .timeline-container::-webkit-scrollbar-track { background: transparent; }
        .timeline-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        .timeline-item {
            display: flex;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid rgba(37, 42, 74, 0.6);
            font-size: 12px;
            align-items: flex-start;
        }
        .timeline-item:last-child { border-bottom: none; }
        .timeline-ts {
            min-width: 90px;
            color: var(--text-muted);
            font-family: 'Consolas', monospace;
            font-size: 11px;
            padding-top: 2px;
        }
        .timeline-source {
            min-width: 110px;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.3px;
        }
        .source-intent { background: rgba(124,111,255,0.15); color: #a5a0ff; }
        .source-governor { background: rgba(52,211,153,0.15); color: #34d399; }
        .source-skill { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .source-error { background: rgba(248,113,113,0.15); color: #f87171; }
        .source-channel { background: rgba(96,165,250,0.15); color: #60a5fa; }
        .source-default { background: rgba(139,144,176,0.15); color: #8b90b0; }
        .timeline-detail { flex: 1; color: var(--text-primary); }
        .timeline-status { font-weight: 700; margin-right: 6px; font-size: 11px; }
        .status-approve { color: var(--success); }
        .status-reject { color: var(--danger); }
        .status-unknown { color: var(--text-muted); }

        /* ── Source 过滤器 ── */
        .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .chip {
            padding: 3px 10px;
            border-radius: 14px;
            font-size: 11px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            transition: all 0.15s;
        }
        .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .chip:hover { border-color: var(--accent); color: var(--text-primary); }

        /* ── 条形图 ── */
        .bar-chart { display: flex; flex-direction: column; gap: 7px; }
        .bar-row { display: flex; align-items: center; gap: 10px; }
        .bar-label {
            min-width: 160px;
            font-size: 11px;
            font-family: 'Consolas', monospace;
            color: var(--text-secondary);
            text-align: right;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .bar-track {
            flex: 1;
            height: 18px;
            background: var(--bg-primary);
            border-radius: 4px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
        }
        .bar-count {
            min-width: 36px;
            font-size: 11px;
            color: var(--text-primary);
            font-weight: 700;
            text-align: right;
        }

        /* ── 空状态/加载/错误 ── */
        .empty-state {
            text-align: center;
            padding: 32px 20px;
            color: var(--text-muted);
        }
        .empty-state .icon { font-size: 36px; margin-bottom: 10px; }
        .empty-state p { font-size: 13px; }
        .loading {
            text-align: center;
            padding: 32px;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg {
            background: var(--danger-bg);
            border: 1px solid rgba(248,113,113,0.3);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            color: var(--danger);
            font-size: 12px;
            margin-bottom: 12px;
        }

        /* ── 响应式 ── */
        @media (max-width: 1100px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; padding: 12px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .search-row { flex-direction: column; }
            .header { padding: 0 12px; }
        }

        /* ── 分隔线 ── */
        .divider {
            height: 1px;
            background: var(--border);
            margin: 12px 0;
        }

        /* ── 刷新动画 ── */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease; }
    </style>
</head>
<body>

<!-- ── 顶部导航 ── -->
<div class="header">
    <div class="header-logo">
        <h1>🌸 Nastume AI</h1>
        <span class="badge">链路可视化面板</span>
        <span class="readonly-tag">🔒 只读</span>
    </div>
    <div class="header-spacer"></div>
    <div class="auto-refresh-ctrl">
        <span id="lastRefreshTime" style="color:var(--text-muted);font-size:11px;">—</span>
        <div class="refresh-toggle" onclick="toggleAutoRefresh()" title="自动刷新">
            <div class="toggle-switch on" id="toggleSwitch">
                <div class="toggle-knob"></div>
            </div>
            <span>自动刷新</span>
        </div>
        <div class="countdown-badge" id="countdownBadge">30s</div>
        <button class="btn btn-secondary btn-sm" onclick="manualRefresh()">↻ 立即刷新</button>
    </div>
</div>

<!-- ── 搜索区 ── -->
<div class="search-section">
    <div class="search-row">
        <input
            type="text"
            class="search-input"
            id="searchInput"
            placeholder="输入 request_id 查询链路详情…"
            autocomplete="off"
        />
        <button class="btn btn-primary" onclick="searchRequest()">🔍 查询链路</button>
        <button class="btn btn-secondary" onclick="clearTimeline()">✕ 清空</button>
    </div>
</div>

<!-- ── 主内容 ── -->
<div class="main-content">

    <!-- 统计卡片 (5个) -->
    <div class="stats-grid">
        <div class="stat-card stat-info">
            <span class="stat-icon">📡</span>
            <div class="stat-value" id="statTotal">—</div>
            <div class="stat-label">总请求</div>
            <div class="stat-sub" id="statTotalSub">&nbsp;</div>
        </div>
        <div class="stat-card stat-success">
            <span class="stat-icon">💬</span>
            <div class="stat-value" id="statChat">—</div>
            <div class="stat-label">Chat 请求</div>
            <div class="stat-sub" id="statChatSub">&nbsp;</div>
        </div>
        <div class="stat-card stat-danger">
            <span class="stat-icon">🚫</span>
            <div class="stat-value" id="statReject">—</div>
            <div class="stat-label">拒绝次数</div>
            <div class="stat-sub" id="statRejectSub">&nbsp;</div>
        </div>
        <div class="stat-card stat-error">
            <span class="stat-icon">⚠️</span>
            <div class="stat-value" id="statErrorRate">—</div>
            <div class="stat-label">拒绝率</div>
            <div class="stat-sub" id="statErrorSub">&nbsp;</div>
        </div>
        <div class="stat-card stat-warning">
            <span class="stat-icon">⏱️</span>
            <div class="stat-value" id="statUptime">—</div>
            <div class="stat-label">运行时长</div>
            <div class="stat-sub" id="statUptimeSub">&nbsp;</div>
        </div>
    </div>

    <!-- 趋势折线图 -->
    <div class="card card-full">
        <div class="card-title">
            📈 请求趋势（近 10 次刷新）
            <span class="card-title-badge" id="trendSampleCount">0 个采样点</span>
        </div>
        <div class="trend-canvas-wrap">
            <canvas id="trendCanvas"></canvas>
        </div>
        <div class="trend-legend">
            <div class="legend-item">
                <div class="legend-dot" style="background:#7c6fff;"></div>
                <span>总请求</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background:#34d399;"></div>
                <span>Chat</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot" style="background:#f87171;"></div>
                <span>拒绝</span>
            </div>
        </div>
    </div>

    <!-- 最近请求列表 -->
    <div class="card">
        <div class="card-title">
            🕐 最近请求
            <span class="card-title-badge" id="recentCountBadge">—</span>
        </div>
        <div id="recentList">
            <div class="recent-empty">⏳ 加载中…</div>
        </div>
    </div>

    <!-- reason_code 分布 -->
    <div class="card">
        <div class="card-title">📊 reason_code 分布</div>
        <div id="reasonCodeChart">
            <div class="empty-state">
                <div class="icon">📈</div>
                <p>加载指标后显示分布</p>
            </div>
        </div>
    </div>

    <!-- 时间线 (全宽) -->
    <div class="card card-full">
        <div class="card-title">
            📋 请求链路时间线
            <span class="card-title-badge" id="timelineBadge">未查询</span>
        </div>
        <div id="errorMsg" style="display:none;"></div>
        <div class="filter-chips" id="filterChips"></div>
        <div class="timeline-container" id="timelineContainer">
            <div class="empty-state">
                <div class="icon">🔍</div>
                <p>从左侧列表点击请求，或手动输入 request_id 查询</p>
            </div>
        </div>
    </div>

    <!-- Source 分布 -->
    <div class="card card-full">
        <div class="card-title">🏷️ Source 分布</div>
        <div id="sourceChart">
            <div class="empty-state">
                <div class="icon">🏷️</div>
                <p>查询链路后显示来源分布</p>
            </div>
        </div>
    </div>

</div><!-- /main-content -->

<script>
// ═══════════════════════════════════════════════════════
//  全局状态
// ═══════════════════════════════════════════════════════
const API_BASE = window.location.origin;
let currentTimeline = [];
let activeFilters = new Set();
let autoRefreshEnabled = true;
let countdownValue = 30;
let countdownTimer = null;
let activeRecentId = null;

// 趋势数据（最近 10 次采样）
const TREND_MAX = 10;
const trendData = {
    labels: [],
    total: [],
    chat: [],
    reject: []
};

// ═══════════════════════════════════════════════════════
//  工具函数
// ═══════════════════════════════════════════════════════
function formatTs(tsMs) {
    if (!tsMs) return '—';
    const d = new Date(tsMs);
    return d.toLocaleTimeString('zh-CN', { hour12: false }) +
           '.' + String(d.getMilliseconds()).padStart(3, '0');
}

function formatUptime(seconds) {
    if (seconds == null || isNaN(seconds)) return '—';
    const s = Math.floor(seconds);
    if (s < 60) return `${s}s`;
    if (s < 3600) return `${Math.floor(s/60)}m ${s%60}s`;
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return `${h}h ${m}m ${sec}s`;
}

function formatTimeShort(tsMs) {
    if (!tsMs) return '—';
    const d = new Date(tsMs);
    return d.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function nowIso() {
    return new Date().toISOString();
}

function hoursAgoIso(h) {
    return new Date(Date.now() - h * 3600 * 1000).toISOString();
}

function getSourceClass(source) {
    if (!source) return 'source-default';
    if (source.includes('intent')) return 'source-intent';
    if (source.includes('governor')) return 'source-governor';
    if (source.includes('skill') || source.includes('exec')) return 'source-skill';
    if (source.includes('error') || source.includes('qa_violation')) return 'source-error';
    if (source.includes('channel') || source.includes('voice') || source.includes('avatar')) return 'source-channel';
    return 'source-default';
}

function getStatusClass(status) {
    if (!status) return 'status-unknown';
    const s = status.toUpperCase();
    if (s === 'APPROVE' || s === 'OK' || s === 'SUCCESS') return 'status-approve';
    if (s === 'REJECT' || s === 'FAILED' || s === 'ERROR') return 'status-reject';
    return 'status-unknown';
}

function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.className = 'error-msg';
    el.textContent = msg;
    el.style.display = 'block';
}

function hideError() {
    document.getElementById('errorMsg').style.display = 'none';
}

// ═══════════════════════════════════════════════════════
//  A. 自动刷新 + 倒计时
// ═══════════════════════════════════════════════════════
function startCountdown() {
    stopCountdown();
    countdownValue = 30;
    updateCountdownUI();
    countdownTimer = setInterval(() => {
        countdownValue--;
        updateCountdownUI();
        if (countdownValue <= 0) {
            countdownValue = 30;
            if (autoRefreshEnabled) {
                doRefresh();
            }
        }
    }, 1000);
}

function stopCountdown() {
    if (countdownTimer) {
        clearInterval(countdownTimer);
        countdownTimer = null;
    }
}

function updateCountdownUI() {
    const badge = document.getElementById('countdownBadge');
    badge.textContent = `${countdownValue}s`;
    if (countdownValue <= 5) {
        badge.style.color = 'var(--warning)';
        badge.style.borderColor = 'rgba(251,191,36,0.4)';
    } else {
        badge.style.color = 'var(--accent)';
        badge.style.borderColor = 'var(--border)';
    }
}

function toggleAutoRefresh() {
    autoRefreshEnabled = !autoRefreshEnabled;
    const sw = document.getElementById('toggleSwitch');
    if (autoRefreshEnabled) {
        sw.classList.add('on');
        startCountdown();
    } else {
        sw.classList.remove('on');
        stopCountdown();
        document.getElementById('countdownBadge').textContent = '暂停';
        document.getElementById('countdownBadge').style.color = 'var(--text-muted)';
    }
}

function manualRefresh() {
    countdownValue = 30;
    updateCountdownUI();
    doRefresh();
}

async function doRefresh() {
    await Promise.all([loadMetrics(), loadRecentRequests()]);
    const now = new Date();
    document.getElementById('lastRefreshTime').textContent =
        '上次刷新 ' + now.toLocaleTimeString('zh-CN', { hour12: false });
}

// ═══════════════════════════════════════════════════════
//  加载 /metrics
// ═══════════════════════════════════════════════════════
async function loadMetrics() {
    try {
        const resp = await fetch(`${API_BASE}/metrics`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        const total = data.total_requests ?? 0;
        const chat = data.total_chat_requests ?? 0;
        const reject = data.total_rejections ?? 0;
        const uptime = data.uptime_seconds ?? 0;
        const rejectRate = total > 0 ? (reject / total * 100).toFixed(1) : '0.0';

        document.getElementById('statTotal').textContent = total;
        document.getElementById('statChat').textContent = chat;
        document.getElementById('statReject').textContent = reject;
        document.getElementById('statErrorRate').textContent = rejectRate + '%';
        document.getElementById('statUptime').textContent = formatUptime(uptime);

        // 副标题
        document.getElementById('statChatSub').textContent =
            total > 0 ? `占比 ${(chat/total*100).toFixed(1)}%` : '';
        document.getElementById('statRejectSub').textContent =
            reject > 0 ? `最近有拒绝事件` : '暂无拒绝';
        document.getElementById('statErrorSub').textContent =
            parseFloat(rejectRate) > 10 ? '⚠️ 偏高' : '正常';
        document.getElementById('statUptimeSub').textContent =
            `${uptime} 秒`;

        renderReasonCodeChart(data.reason_code_distribution || {});

        // 更新趋势数据
        const label = new Date().toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
        pushTrend(label, total, chat, reject);

    } catch (e) {
        console.error('加载指标失败:', e);
    }
}

// ═══════════════════════════════════════════════════════
//  B. 最近请求列表
// ═══════════════════════════════════════════════════════
async function loadRecentRequests() {
    const container = document.getElementById('recentList');
    try {
        const end = nowIso();
        const start = hoursAgoIso(24);
        const url = `${API_BASE}/ui/search-requests?query=&start_time=${encodeURIComponent(start)}&end_time=${encodeURIComponent(end)}&page=1&page_size=20`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        const results = data.results || [];

        document.getElementById('recentCountBadge').textContent =
            `共 ${data.total ?? results.length} 条`;

        if (results.length === 0) {
            container.innerHTML = '<div class="recent-empty">暂无最近请求记录</div>';
            return;
        }

        let html = '<div class="recent-list fade-in">';
        for (const item of results) {
            const rid = item.request_id || item.id || '—';
            const ts = item.timestamp ? formatTimeShort(item.timestamp) : '—';
            const status = item.status || '';
            let statusCls = 'rs-unknown';
            let statusLabel = status || '—';
            const su = status.toUpperCase();
            if (su === 'APPROVE' || su === 'OK' || su === 'SUCCESS') { statusCls = 'rs-ok'; statusLabel = '✓ OK'; }
            else if (su === 'REJECT') { statusCls = 'rs-reject'; statusLabel = '✗ 拒绝'; }
            else if (su === 'ERROR' || su === 'FAILED') { statusCls = 'rs-error'; statusLabel = '⚠ 错误'; }

            const isActive = rid === activeRecentId ? ' active' : '';
            html += `
                <div class="recent-item${isActive}" onclick="clickRecentItem('${rid}')" title="${rid}">
                    <div class="recent-rid">${rid}</div>
                    <div class="recent-ts">${ts}</div>
                    <div class="recent-status ${statusCls}">${statusLabel}</div>
                </div>`;
        }
        html += '</div>';
        container.innerHTML = html;

    } catch (e) {
        container.innerHTML = `<div class="recent-empty">⚠️ 加载失败: ${e.message}</div>`;
    }
}

function clickRecentItem(rid) {
    activeRecentId = rid;
    document.getElementById('searchInput').value = rid;
    // 更新高亮
    document.querySelectorAll('.recent-item').forEach(el => {
        el.classList.toggle('active', el.querySelector('.recent-rid').textContent === rid);
    });
    searchRequest();
}

// ═══════════════════════════════════════════════════════
//  查询请求链路
// ═══════════════════════════════════════════════════════
async function searchRequest() {
    const input = document.getElementById('searchInput').value.trim();
    if (!input) return;

    hideError();
    const container = document.getElementById('timelineContainer');
    container.innerHTML = '<div class="loading">加载中</div>';
    document.getElementById('timelineBadge').textContent = '查询中…';

    try {
        const resp = await fetch(`${API_BASE}/observability/trace`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ request_id: input })
        });

        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.detail || `HTTP ${resp.status}`);
        }

        const data = await resp.json();
        currentTimeline = data.timeline || [];

        document.getElementById('timelineBadge').textContent =
            `${currentTimeline.length} 个事件`;

        renderFilterChips(data.sources || {});
        renderTimeline(currentTimeline);
        renderSourceChart(data.sources || {});

    } catch (e) {
        showError(`查询失败: ${e.message}`);
        container.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
        document.getElementById('timelineBadge').textContent = '查询失败';
    }
}

function clearTimeline() {
    currentTimeline = [];
    activeFilters.clear();
    document.getElementById('filterChips').innerHTML = '';
    document.getElementById('timelineContainer').innerHTML =
        '<div class="empty-state"><div class="icon">🔍</div><p>从左侧列表点击请求，或手动输入 request_id 查询</p></div>';
    document.getElementById('sourceChart').innerHTML =
        '<div class="empty-state"><div class="icon">🏷️</div><p>查询链路后显示来源分布</p></div>';
    document.getElementById('timelineBadge').textContent = '未查询';
    document.getElementById('searchInput').value = '';
    hideError();
    activeRecentId = null;
    document.querySelectorAll('.recent-item').forEach(el => el.classList.remove('active'));
}

// ═══════════════════════════════════════════════════════
//  渲染时间线
// ═══════════════════════════════════════════════════════
function renderTimeline(items) {
    const container = document.getElementById('timelineContainer');
    if (!items || items.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>该 request_id 无链路事件</p></div>';
        return;
    }
    let filtered = items;
    if (activeFilters.size > 0) {
        filtered = items.filter(item => activeFilters.has(item.source));
    }
    if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>当前过滤条件下无匹配事件</p></div>';
        return;
    }
    let html = '';
    for (const item of filtered) {
        const statusCls = getStatusClass(item.status);
        const sourceCls = getSourceClass(item.source || '');
        html += `
            <div class="timeline-item">
                <div class="timeline-ts">${formatTs(item.ts_ms)}</div>
                <div class="timeline-source ${sourceCls}">${(item.source || '').replace(/_log$/, '')}</div>
                <div class="timeline-detail">
                    <span class="timeline-status ${statusCls}">${item.status || '—'}</span>
                    ${item.reason_code ? `<code style="color:var(--warning);font-size:11px;margin-right:4px;">${item.reason_code}</code>` : ''}
                    ${item.detail ? `<span style="color:var(--text-secondary);font-size:11px;">${item.detail}</span>` : ''}
                </div>
            </div>`;
    }
    container.innerHTML = html;
}

// ═══════════════════════════════════════════════════════
//  Source 过滤器
// ═══════════════════════════════════════════════════════
function renderFilterChips(sources) {
    const container = document.getElementById('filterChips');
    activeFilters.clear();
    if (!sources || Object.keys(sources).length === 0) {
        container.innerHTML = '';
        return;
    }
    let html = '<span class="chip active" onclick="toggleAllFilters()">全部</span>';
    for (const [source, count] of Object.entries(sources)) {
        html += `<span class="chip" data-source="${source}" onclick="toggleFilter(this,'${source}')">${source.replace(/_log$/, '')} (${count})</span>`;
    }
    container.innerHTML = html;
}

function toggleFilter(chip, source) {
    chip.classList.toggle('active');
    if (activeFilters.has(source)) activeFilters.delete(source);
    else activeFilters.add(source);
    const allChip = document.querySelector('.filter-chips .chip:first-child');
    allChip.classList.toggle('active', activeFilters.size === 0);
    renderTimeline(currentTimeline);
}

function toggleAllFilters() {
    activeFilters.clear();
    document.querySelectorAll('.filter-chips .chip').forEach(c => c.classList.remove('active'));
    document.querySelector('.filter-chips .chip:first-child').classList.add('active');
    renderTimeline(currentTimeline);
}

// ═══════════════════════════════════════════════════════
//  Source 分布图
// ═══════════════════════════════════════════════════════
function renderSourceChart(sources) {
    const container = document.getElementById('sourceChart');
    if (!sources || Object.keys(sources).length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">🏷️</div><p>无数据</p></div>';
        return;
    }
    const total = Object.values(sources).reduce((a, b) => a + b, 0);
    const colors = ['#7c6fff','#34d399','#fbbf24','#f87171','#60a5fa','#c084fc','#fb923c','#a3e635'];
    let html = '<div class="bar-chart">';
    let i = 0;
    for (const [source, count] of Object.entries(sources).sort((a, b) => b[1] - a[1])) {
        const pct = total > 0 ? (count / total * 100) : 0;
        html += `
            <div class="bar-row">
                <div class="bar-label">${source.replace(/_log$/, '')}</div>
                <div class="bar-track">
                    <div class="bar-fill" style="width:${pct}%;background:${colors[i%colors.length]};"></div>
                </div>
                <div class="bar-count">${count}</div>
            </div>`;
        i++;
    }
    html += '</div>';
    container.innerHTML = html;
}

// ═══════════════════════════════════════════════════════
//  reason_code 分布图
// ═══════════════════════════════════════════════════════
function renderReasonCodeChart(distribution) {
    const container = document.getElementById('reasonCodeChart');
    if (!distribution || Object.keys(distribution).length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">✅</div><p>无拒绝记录</p></div>';
        return;
    }
    const total = Object.values(distribution).reduce((a, b) => a + b, 0);
    const colors = ['#f87171','#fb923c','#fbbf24','#a3e635','#34d399','#60a5fa','#c084fc'];
    let html = '<div class="bar-chart">';
    let i = 0;
    for (const [code, count] of Object.entries(distribution).sort((a, b) => b[1] - a[1])) {
        const pct = total > 0 ? (count / total * 100) : 0;
        html += `
            <div class="bar-row">
                <div class="bar-label">${code}</div>
                <div class="bar-track">
                    <div class="bar-fill" style="width:${pct}%;background:${colors[i%colors.length]};"></div>
                </div>
                <div class="bar-count">${count}</div>
            </div>`;
        i++;
    }
    html += '</div>';
    container.innerHTML = html;
}

// ═══════════════════════════════════════════════════════
//  趋势折线图 (Canvas)
// ═══════════════════════════════════════════════════════
function pushTrend(label, total, chat, reject) {
    trendData.labels.push(label);
    trendData.total.push(total);
    trendData.chat.push(chat);
    trendData.reject.push(reject);
    if (trendData.labels.length > TREND_MAX) {
        trendData.labels.shift();
        trendData.total.shift();
        trendData.chat.shift();
        trendData.reject.shift();
    }
    document.getElementById('trendSampleCount').textContent =
        `${trendData.labels.length} 个采样点`;
    drawTrend();
}

function drawTrend() {
    const canvas = document.getElementById('trendCanvas');
    const wrap = canvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const W = wrap.clientWidth;
    const H = wrap.clientHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);

    const n = trendData.labels.length;
    if (n < 2) {
        ctx.fillStyle = '#555a7a';
        ctx.font = '12px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('采样点不足，等待更多数据…', W / 2, H / 2);
        return;
    }

    const PAD = { top: 10, right: 20, bottom: 28, left: 40 };
    const cW = W - PAD.left - PAD.right;
    const cH = H - PAD.top - PAD.bottom;

    // 计算 Y 轴范围
    const allVals = [...trendData.total, ...trendData.chat, ...trendData.reject];
    const maxVal = Math.max(...allVals, 1);
    const minVal = 0;

    function xPos(i) { return PAD.left + (i / (n - 1)) * cW; }
    function yPos(v) { return PAD.top + cH - ((v - minVal) / (maxVal - minVal)) * cH; }

    // 网格线
    ctx.strokeStyle = '#252a4a';
    ctx.lineWidth = 1;
    for (let g = 0; g <= 4; g++) {
        const y = PAD.top + (g / 4) * cH;
        ctx.beginPath();
        ctx.moveTo(PAD.left, y);
        ctx.lineTo(PAD.left + cW, y);
        ctx.stroke();
        // Y 轴标签
        const val = Math.round(maxVal - (g / 4) * maxVal);
        ctx.fillStyle = '#555a7a';
        ctx.font = `10px Consolas`;
        ctx.textAlign = 'right';
        ctx.fillText(val, PAD.left - 4, y + 3);
    }

    // 绘制折线
    function drawLine(series, color, fillColor) {
        // 填充区域
        ctx.beginPath();
        ctx.moveTo(xPos(0), yPos(series[0]));
        for (let i = 1; i < n; i++) ctx.lineTo(xPos(i), yPos(series[i]));
        ctx.lineTo(xPos(n - 1), PAD.top + cH);
        ctx.lineTo(xPos(0), PAD.top + cH);
        ctx.closePath();
        ctx.fillStyle = fillColor;
        ctx.fill();

        // 折线
        ctx.beginPath();
        ctx.moveTo(xPos(0), yPos(series[0]));
        for (let i = 1; i < n; i++) ctx.lineTo(xPos(i), yPos(series[i]));
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.stroke();

        // 数据点
        for (let i = 0; i < n; i++) {
            ctx.beginPath();
            ctx.arc(xPos(i), yPos(series[i]), 3, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
        }
    }

    drawLine(trendData.reject, '#f87171', 'rgba(248,113,113,0.06)');
    drawLine(trendData.chat,   '#34d399', 'rgba(52,211,153,0.06)');
    drawLine(trendData.total,  '#7c6fff', 'rgba(124,111,255,0.08)');

    // X 轴标签（只显示首尾和中间）
    ctx.fillStyle = '#555a7a';
    ctx.font = '10px Consolas';
    ctx.textAlign = 'center';
    const showIdx = [0, Math.floor((n-1)/2), n-1].filter((v,i,a) => a.indexOf(v) === i);
    for (const i of showIdx) {
        ctx.fillText(trendData.labels[i], xPos(i), H - PAD.bottom + 14);
    }
}

// ═══════════════════════════════════════════════════════
//  回车键搜索
// ═══════════════════════════════════════════════════════
document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') searchRequest();
});

// 窗口 resize 重绘趋势图
window.addEventListener('resize', () => {
    if (trendData.labels.length > 0) drawTrend();
});

// ═══════════════════════════════════════════════════════
//  初始化
// ═══════════════════════════════════════════════════════
(async function init() {
    await doRefresh();
    startCountdown();
})();
</script>
