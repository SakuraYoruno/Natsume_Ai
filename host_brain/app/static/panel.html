<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nastume AI — 监控面板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/panel.css">
</head>
<body>

<!-- ══════════════════════════════════════════════════
     顶部导航栏
══════════════════════════════════════════════════ -->
<header class="topbar">
    <div class="topbar-brand">
        <div class="brand-icon">🌸</div>
        Nastume AI
    </div>
    <div class="topbar-divider"></div>
    <span class="topbar-title">链路监控面板</span>
    <div class="topbar-spacer"></div>

    <!-- 运行状态 -->
    <span class="status-dot" id="svcStatus">服务运行中</span>
    <div class="topbar-divider"></div>

    <!-- 上次刷新 -->
    <span class="text-muted" style="font-size:11px;">
        上次刷新 <span id="lastRefresh" class="mono">—</span>
    </span>
    <div class="topbar-divider"></div>

    <!-- 自动刷新 -->
    <div class="refresh-ctrl">
        <span class="refresh-label">自动刷新</span>
        <label class="toggle" title="切换自动刷新">
            <input type="checkbox" id="toggleInput" checked onchange="toggleAutoRefresh()">
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
        </label>
        <span class="countdown" id="countdown">30s</span>
    </div>
    <button class="btn btn-default btn-sm" onclick="manualRefresh()">
        <i class="bi bi-arrow-clockwise"></i> 刷新
    </button>
</header>

<!-- ══════════════════════════════════════════════════
     搜索栏
══════════════════════════════════════════════════ -->
<div class="search-bar">
    <div class="search-input-wrap">
        <i class="bi bi-search search-icon"></i>
        <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="输入 request_id 查询链路…"
            autocomplete="off"
            spellcheck="false"
        >
    </div>
    <button class="btn btn-primary" onclick="searchRequest()">
        <i class="bi bi-diagram-3"></i> 查询链路
    </button>
    <button class="btn btn-default" onclick="clearSearch()">
        <i class="bi bi-x"></i> 清空
    </button>
</div>

<!-- ══════════════════════════════════════════════════
     主体内容
══════════════════════════════════════════════════ -->
<main class="page-body">

    <!-- ── 统计卡片行 ── -->
    <div class="stats-row">
        <div class="stat-panel stat-blue">
            <div class="stat-label">总请求</div>
            <div class="stat-value" id="statTotal">—</div>
            <div class="stat-sub" id="statTotalSub">&nbsp;</div>
        </div>
        <div class="stat-panel stat-green">
            <div class="stat-label">Chat 请求</div>
            <div class="stat-value" id="statChat">—</div>
            <div class="stat-sub" id="statChatSub">&nbsp;</div>
        </div>
        <div class="stat-panel stat-red">
            <div class="stat-label">拒绝次数</div>
            <div class="stat-value" id="statReject">—</div>
            <div class="stat-sub" id="statRejectSub">&nbsp;</div>
        </div>
        <div class="stat-panel stat-orange">
            <div class="stat-label">拒绝率</div>
            <div class="stat-value" id="statRate">—</div>
            <div class="stat-sub" id="statRateSub">&nbsp;</div>
        </div>
        <div class="stat-panel stat-yellow">
            <div class="stat-label">运行时长</div>
            <div class="stat-value" id="statUptime">—</div>
            <div class="stat-sub" id="statUptimeSub">&nbsp;</div>
        </div>
    </div>

    <!-- ── 左列：最近请求 + reason_code ── -->
    <div style="display:flex;flex-direction:column;gap:12px;">

        <!-- 最近请求列表 -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <i class="bi bi-clock-history"></i> 最近请求
                </div>
                <span class="panel-badge" id="recentBadge">—</span>
            </div>
            <div id="recentList">
                <div class="loading-row">
                    <div class="spinner"></div> 加载中…
                </div>
            </div>
        </div>

        <!-- reason_code 分布 -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <i class="bi bi-bar-chart-steps"></i> Reason Code 分布
                </div>
            </div>
            <div class="panel-body" id="reasonChart">
                <div class="empty">
                    <i class="bi bi-check-circle"></i>
                    <p>暂无拒绝记录</p>
                </div>
            </div>
        </div>

    </div>

    <!-- ── 右列：趋势图 + 时间线 + source 分布 ── -->
    <div style="display:flex;flex-direction:column;gap:12px;">

        <!-- 请求趋势图 -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <i class="bi bi-graph-up"></i> 请求趋势
                </div>
                <span class="panel-badge" id="trendSamples">0 个采样点</span>
            </div>
            <div class="trend-wrap">
                <canvas id="trendCanvas"></canvas>
            </div>
            <div class="trend-legend">
                <div class="legend-item">
                    <div class="legend-line" style="background:#4a9eff;"></div>
                    总请求
                </div>
                <div class="legend-item">
                    <div class="legend-line" style="background:#73bf69;"></div>
                    Chat
                </div>
                <div class="legend-item">
                    <div class="legend-line" style="background:#f2495c;"></div>
                    拒绝
                </div>
            </div>
        </div>

        <!-- 链路时间线 -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <i class="bi bi-list-ul"></i> 链路时间线
                </div>
                <span class="panel-badge" id="timelineBadge">—</span>
            </div>

            <!-- 错误提示 -->
            <div id="errorAlert" class="alert-error" style="display:none;"></div>

            <!-- Source 过滤器 -->
            <div class="filter-bar" id="filterBar"></div>

            <!-- 时间线内容 -->
            <div class="timeline-wrap" id="timelineWrap">
                <div class="empty">
                    <i class="bi bi-search"></i>
                    <p>从左侧点击请求，或输入 request_id 查询</p>
                </div>
            </div>
        </div>

        <!-- Source 分布 -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <i class="bi bi-pie-chart"></i> Source 分布
                </div>
            </div>
            <div class="panel-body" id="sourceChart">
                <div class="empty">
                    <i class="bi bi-bar-chart"></i>
                    <p>查询链路后显示来源分布</p>
                </div>
            </div>
        </div>

    </div>

</main>

<script src="/static/panel.js"></script>
</body>
</html>
