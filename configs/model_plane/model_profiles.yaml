# 受众：CODEX
# 标题：model_profiles（模型平面 profile：路由/预算/降级）
# 版本：v1.0
# 说明：任何 routing/timeouts/token_cap 变更必须 bump model_profile_id，并写入 llm_call_log。

profiles:
  chat_ja_24x7_v1:
    model_profile_id: chat_ja_24x7_v1
    description: "日文像她、闲聊 24h 常驻；执行仍走 Governor"
    contracts:
      core: CoreDraft.v1
      render: RenderDraft.v1
      verifier: Verifier.v1
    routing:
      CHAT:
        chain:
          - core_reasoner_primary
          - safety_verifier
          - renderer_ja_c_style
        timeouts_ms:
          core_reasoner_primary: 2500
          safety_verifier: 900
          renderer_ja_c_style: 1200
        output_caps:
          core_max_tokens: 420
          render_max_tokens: 360
        fallback:
          - when: TIMEOUT(core_reasoner_primary)
            use: core_reasoner_secondary
          - when: TIMEOUT(core_reasoner_secondary) OR FORMAT_FAIL
            use: host_fallback_policy

      EXEC_INTENT:
        chain:
          - planner_constraints
          - tool_planner
          - safety_verifier
        timeouts_ms:
          planner_constraints: 2200
          tool_planner: 2200
          safety_verifier: 900
        output_caps:
          core_max_tokens: 320
        notes: "仅产 intent_draft 草案；最终由 Host Governor 决策与签发 token"

      WORK_TRANSLATE:
        chain:
          - workbench_translate
          - consistency_verifier
        timeouts_ms:
          workbench_translate: 6000
          consistency_verifier: 1200
        output_caps:
          core_max_tokens: 900

      WORK_CODE:
        chain:
          - workbench_code_assist
          - consistency_verifier
        timeouts_ms:
          workbench_code_assist: 6000
          consistency_verifier: 1200
        output_caps:
          core_max_tokens: 900

    mode_overrides:
      Gaming:
        host_policy: NO_LOCAL_GPU
        aggressive_fallback: true
        output_caps:
          core_max_tokens: 260
          render_max_tokens: 260
