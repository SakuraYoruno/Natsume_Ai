name: service-integration

on:
  workflow_dispatch:
  schedule:
    - cron: "41 19 * * *"

permissions:
  contents: read

concurrency:
  group: service-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HOST_BACKGROUND_TASKS_ENABLED: "false"
  HOST_CODEX_IMMUNE_AUTODISPATCH_ENABLED: "false"
  HOST_CODEX_IMMUNE_SCHEDULER_ENABLED: "false"
  HOST_CODEX_IMMUNE_MONITOR_ENABLED: "false"
  HOST_BOND_BACKEND: neo4j
  HOST_BOND_SQLITE_PATH: ""
  NASTUME_TEST_REDIS_URL: redis://127.0.0.1:6379/0
  HOST_RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/0
  PYTEST_ADDOPTS: "--tb=short -p no:warnings"

jobs:
  redis-chroma-neo4j:
    name: Redis / Chroma / Neo4j prod-env pytest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_server_memory_heap_initial__size: 512m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio pytest-cov pytest-subtests httpx requests PyYAML pillow openai redis neo4j chromadb

      - name: Write CI service environment
        run: |
          mkdir -p configs/secrets
          cat > .env <<'EOF'
          Natsume_ENV=prod
          HOST_BOND_BACKEND=neo4j
          BOND_NEO4J_ENABLED=true
          BOND_NEO4J_URI=bolt://127.0.0.1:7687
          BOND_NEO4J_DATABASE=neo4j
          BOND_NEO4J_AUTH_REF=sec://neo4j/ci
          BOND_NEO4J_POOL_SIZE=8
          BOND_NEO4J_TLS_ENABLED=false
          CHROMA_ENABLED=true
          CHROMA_ENDPOINT=http://127.0.0.1:8000
          CHROMA_TENANT=default_tenant
          CHROMA_DATABASE=default_database
          CHROMA_DEFAULT_COLLECTION=episodic
          CHROMA_COLLECTION_PROFILES_JSON={"episodic":4,"canon":4}
          HOST_RATE_LIMIT_REDIS_URL=redis://127.0.0.1:6379/0
          EOF
          cat > configs/secrets/secret_store.runtime.local.json <<'EOF'
          {"sec://neo4j/ci":"neo4j:testpassword"}
          EOF

      - name: Start Chroma
        run: |
          nohup chroma run --host 127.0.0.1 --port 8000 --path .chroma-ci > chroma.log 2>&1 &
          python - <<'PY'
          import sys
          import time
          import urllib.request

          urls = [
              "http://127.0.0.1:8000/api/v2/heartbeat",
              "http://127.0.0.1:8000/api/v1/heartbeat",
          ]
          deadline = time.time() + 60
          last_error = ""
          while time.time() < deadline:
              for url in urls:
                  try:
                      with urllib.request.urlopen(url, timeout=2) as resp:
                          if resp.status < 500:
                              print(f"Chroma ready: {url}")
                              raise SystemExit(0)
                  except Exception as exc:
                      last_error = str(exc)
              time.sleep(2)
          print(f"Chroma did not become ready: {last_error}", file=sys.stderr)
          raise SystemExit(1)
          PY

      - name: Run service integration pytest
        run: |
          python -m pytest -q \
            tests/integration/test_rate_limit_redis_integration.py \
            tests/integration/test_memory_hub_prod_env.py \
            tests/integration/test_neo4j_prod_env.py \
            tests/integration/test_bond_queue_summarizer_prod_env.py \
            tests/unit/test_bond_phase5.py \
            --junitxml=pytest-service-integration.xml

      - name: Upload service reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-integration-reports
          path: |
            pytest-service-integration.xml
            chroma.log
