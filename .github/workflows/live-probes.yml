name: live-probes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-probes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HOST_BACKGROUND_TASKS_ENABLED: "false"
  HOST_CODEX_IMMUNE_AUTODISPATCH_ENABLED: "false"
  HOST_CODEX_IMMUNE_SCHEDULER_ENABLED: "false"
  HOST_CODEX_IMMUNE_MONITOR_ENABLED: "false"
  HOST_BOND_BACKEND: memory
  HOST_BOND_SQLITE_PATH: ""
  PYTEST_ADDOPTS: "--tb=short -p no:warnings"

jobs:
  self-hosted-live-probes:
    name: self-hosted hardware / runtime probes
    runs-on: [self-hosted, windows, natsume-live]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio pytest-cov pytest-subtests httpx requests PyYAML pillow openai

      - name: Run live probe pytest
        shell: pwsh
        run: |
          python -m pytest tests -q `
            -m "hw or runtime_probe or e2e" `
            --junitxml=pytest-live-probes.xml

      - name: Upload live probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-live-probes-report
          path: pytest-live-probes.xml
