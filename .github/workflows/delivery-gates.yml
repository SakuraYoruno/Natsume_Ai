name: delivery-gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  delivery-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Unified Delivery Gate
        run: |
          python tools/doc_lint/delivery_gate.py --root . --report-file delivery_gate_report.json

      - name: Upload Delivery Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-gate-report
          path: delivery_gate_report.json
