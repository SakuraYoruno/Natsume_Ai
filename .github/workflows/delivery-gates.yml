name: delivery-gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_full_suite:
        description: "Run the full pytest suite, including live/runtime-probe markers."
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: read

concurrency:
  group: delivery-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HOST_BACKGROUND_TASKS_ENABLED: "false"
  HOST_CODEX_IMMUNE_AUTODISPATCH_ENABLED: "false"
  HOST_CODEX_IMMUNE_SCHEDULER_ENABLED: "false"
  HOST_CODEX_IMMUNE_MONITOR_ENABLED: "false"
  HOST_BOND_BACKEND: memory
  HOST_BOND_SQLITE_PATH: ""
  PYTEST_ADDOPTS: "--tb=short -p no:warnings"

jobs:
  stable-unit-tests:
    name: stable pytest unit shard ${{ matrix.shard_index }} / 6
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3, 4, 5]
        shard_total: [6]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.0.2 pytest-asyncio pytest-cov pytest-subtests httpx requests PyYAML pillow openai

      - name: Run stable unit pytest shard
        shell: pwsh
        run: |
          $files = @(Get-ChildItem tests/unit -Recurse -Filter "test_*.py" | Sort-Object FullName)
          $selected = @()
          for ($i = 0; $i -lt $files.Count; $i++) {
            if (($i % ${{ matrix.shard_total }}) -eq ${{ matrix.shard_index }}) {
              $selected += $files[$i].FullName
            }
          }
          if ($selected.Count -eq 0) {
            throw "No unit tests selected for shard ${{ matrix.shard_index }}"
          }
          "Selected $($selected.Count) unit test files for shard ${{ matrix.shard_index }} / ${{ matrix.shard_total }}" | Tee-Object -FilePath pytest-stable-unit-shard-${{ matrix.shard_index }}.txt
          $selected | Add-Content -Path pytest-stable-unit-shard-${{ matrix.shard_index }}.txt
          python -m pytest $selected `
            -q `
            -m "not e2e and not hw and not prod_env and not runtime_probe and not docker and not ci_unstable" `
            --maxfail=1 `
            --junitxml=pytest-stable-unit-shard-${{ matrix.shard_index }}.xml

      - name: Upload stable unit pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-stable-unit-shard-${{ matrix.shard_index }}-report
          path: |
            pytest-stable-unit-shard-${{ matrix.shard_index }}.xml
            pytest-stable-unit-shard-${{ matrix.shard_index }}.txt

  stable-contract-integration-tests:
    name: stable pytest contract / integration
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.0.2 pytest-asyncio pytest-cov pytest-subtests httpx requests PyYAML pillow openai

      - name: Run stable contract and integration pytest
        shell: pwsh
        run: |
          python -m pytest tests/contract tests/integration `
            -q `
            -m "not e2e and not hw and not prod_env and not runtime_probe and not docker and not ci_unstable" `
            --maxfail=1 `
            --junitxml=pytest-stable-contract-integration.xml

      - name: Upload stable contract and integration pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-stable-contract-integration-report
          path: pytest-stable-contract-integration.xml

  delivery-gate:
    name: delivery gate (static / docs / hard-cut)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify Codex hard-cut terms stay out of runtime
        shell: python
        run: |
          from pathlib import Path
          root = Path.cwd()
          terms = [
              "codex_" + "codegen",
              "execute_" + "codex_" + "codegen",
              "HOST_CODEX_" + "SELF_HEAL",
              "codex" + "_self_heal",
          ]
          suffixes = {".py", ".yaml", ".yml", ".json"}
          roots = [root / name for name in ("host_brain", "tests", "scripts", "prompts")]
          files = [root / "docs/50_project/arch/CODEX_DIGITAL_LIFE_ADVANCED_IDEAS.md"]
          for scan_root in roots:
              if not scan_root.exists():
                  continue
              for path in scan_root.rglob("*"):
                  if path.is_file() and path.suffix.lower() in suffixes:
                      files.append(path)

          failures = []
          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              rel = path.relative_to(root).as_posix()
              for lineno, line in enumerate(text.splitlines(), start=1):
                  for term in terms:
                      if term in line:
                          failures.append(f"{rel}:{lineno}: {term}")

          if failures:
              print("Legacy Codex hard-cut terms found:")
              print("\n".join(failures))
              raise SystemExit(1)

      - name: Run Delivery Gate
        run: |
          python tools/doc_lint/delivery_gate.py \
            --root . \
            --checks static_scan,doc_gate \
            --doc-path .github/workflows/README.md \
            --report-file delivery_gate_report.json

      - name: Upload Delivery Gate Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delivery-gate-report
          path: delivery_gate_report.json

  full-suite:
    name: full pytest (manual / nightly)
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_full_suite) }}
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.0.2 pytest-asyncio pytest-cov pytest-subtests httpx requests PyYAML pillow openai

      - name: Run full pytest
        shell: pwsh
        continue-on-error: true
        run: |
          python -m pytest -q --junitxml=pytest-full.xml

      - name: Summarize full pytest report
        if: always()
        shell: pwsh
        run: |
          "Full pytest is report-only. Environment-specific failures are classified through service-integration or live-probe workflows." >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path pytest-full.xml) {
            "JUnit report: pytest-full.xml" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "JUnit report was not produced." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload full pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-full-report
          path: pytest-full.xml
