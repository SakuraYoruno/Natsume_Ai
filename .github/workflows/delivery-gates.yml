name: delivery-gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # ── Job 1: 全量 pytest 测试套件 ──────────────────────────────────────────
  pytest:
    name: pytest (unit / contract / integration / e2e)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest (all tests)
        run: |
          python -m pytest tests/ \
            -q \
            --tb=short \
            --junitxml=pytest_report.xml \
            -p no:warnings
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest_report.xml

  # ── Job 2: 交付门禁（static_scan / doc_gate）────────────────────────────
  delivery-gate:
    name: delivery-gate (static_scan / doc_gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Delivery Gate (static_scan + doc_gate only)
        run: |
          python tools/doc_lint/delivery_gate.py \
            --root . \
            --checks static_scan,doc_gate \
            --report-file delivery_gate_report.json
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload Delivery Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-gate-report
          path: delivery_gate_report.json
