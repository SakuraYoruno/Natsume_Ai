[project]
name = "edge-client"
version = "0.0.1"
description = "Nastume Edge Client skeleton"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.0.0,<2",
  "sounddevice>=0.4.6,<1",
  "numpy>=1.24,<3",
  "pyvts>=0.3.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0,<10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
