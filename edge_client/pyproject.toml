[project]
name = "edge-client"
version = "0.0.1"
description = "Natsume Edge Client skeleton"
requires-python = ">=3.11"
dependencies = [
  "natsume-contracts>=0.1.0,<1",
  "fastapi>=0.111.0,<1",
  "uvicorn>=0.30.0,<1",
  "faster-whisper>=1.0.0,<2",
  "sounddevice>=0.4.6,<1",
  "numpy>=1.24,<3",
  "pyvts>=0.3.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0,<10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "edge_client",
  "edge_client.actuators",
  "edge_client.app",
  "edge_client.channels",
  "edge_client.gateway",
  "edge_client.gateway.adapters",
  "edge_client.gateway.media",
  "edge_client.proofs",
  "edge_client.rpc",
  "edge_client.runtime",
  "edge_client.security_probe",
  "edge_client.senses",
  "edge_client.services",
  "edge_client.tribe",
]
package-dir = {edge_client = "."}

[tool.setuptools.package-data]
edge_client = ["runtime_texts.json"]
